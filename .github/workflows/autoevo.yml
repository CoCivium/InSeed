name: CoAutoEvoReadOnly
on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inseed-autoevo-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record existing evolution-log identity without mutation
        shell: bash
        run: |
          set -euo pipefail
          printf 'SOURCE_COMMIT=%s\n' "$GITHUB_SHA"
          if test -f evo.log; then
            printf 'EVO_LOG_SHA256='
            sha256sum evo.log | cut -d ' ' -f 1
          else
            printf 'EVO_LOG_STATUS=ABSENT\n'
          fi
          printf 'READ_ONLY_AUDIT=PASS\n'
