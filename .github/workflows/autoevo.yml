name: CoAutoEvo (legacy mutator quarantined)
# Historical scheduled log writer retained in Git history; no scheduled
# continuation, publication rights or automatically appended claim records.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-source-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show source identity without generating artificial progress
        run: |
          set -eu
          echo "HOLD_LEGACY_LOG_AUTOMUTATION__SOURCE_ONLY"
          git rev-parse HEAD
          sha256sum index.html
