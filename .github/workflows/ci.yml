name: InSeed source identity only (no live-service claim)
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  vast:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show exact checked-out public source, not external uptime
        run: |
          set -eu
          echo "INSEED_SOURCE_CHECK_ONLY__NO_EXTERNAL_SERVICE_VERIFICATION"
          git rev-parse HEAD
          sha256sum index.html CNAME
