name: CoEvoForeverReadOnly
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inseed-forever-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify homepage source without mutation
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          printf 'SOURCE_COMMIT=%s\n' "$GITHUB_SHA"
          printf 'INDEX_SHA256='
          sha256sum index.html | cut -d ' ' -f 1
          printf 'READ_ONLY_AUDIT=PASS\n'
