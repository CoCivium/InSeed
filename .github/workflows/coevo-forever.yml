name: CoEvoForever (legacy mutator quarantined)
# Historical scheduled writer retained in Git history; inactive on this
# review branch.  Deliberate manual inspection only, without a write token.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-source-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show immutable source identity and no active publication effect
        run: |
          set -eu
          echo "HOLD_LEGACY_HOMEPAGE_MUTATOR__SOURCE_ONLY"
          git rev-parse HEAD
          sha256sum index.html
