name: InSeed first-use source checks
on:
  pull_request:
    paths:
      - "index.html"
      - "tests/test_inseed_first_use_r0.py"
      - ".github/workflows/**"
      - "**/*.ps1"
      - "CNAME"
      - "board/CNAME"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-only semantics and no hidden directives
        run: python -B -m unittest discover -s tests -p 'test_inseed_first_use_r0.py' -v
